name: Build Desktop App

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS é best-effort: o empacotamento do .dmg costuma falhar no hdiutil
    # dos runners (Apple Silicon). Não pode bloquear a publicação do .exe.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Python 3.11 fornece o módulo `distutils` que o node-gyp (bundled no
      # active-win) ainda importa. Runners trazem Python 3.12+ por padrão, que
      # removeu o distutils — sem isso o rebuild nativo do active-win falha.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm install

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # O empacotamento do .dmg falha de forma intermitente no hdiutil dos
      # runners Apple Silicon ("Resource busy"). É transitório, então tentamos
      # até 3x antes de desistir — assim o .dmg para no release de forma
      # confiável em vez de sumir (causando 404 no download do Mac).
      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          for attempt in 1 2 3; do
            echo "== build:mac (tentativa $attempt/3) =="
            if npm run build:mac; then
              echo "build:mac concluído na tentativa $attempt"
              exit 0
            fi
            echo "build:mac falhou na tentativa $attempt; aguardando antes de tentar de novo..."
            rm -rf dist
            sleep 15
          done
          echo "build:mac falhou após 3 tentativas"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monitor-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.dmg
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # latest.yml e .blockmap são obrigatórios para o electron-updater
          # detectar e baixar atualizações; sem eles o auto-update não funciona.
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.blockmap
            artifacts/**/latest.yml
            artifacts/**/latest-mac.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
