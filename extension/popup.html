<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Monitor de Atividade</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        width: 300px;
        margin: 0;
        padding: 16px;
        background: #f8fafc;
        color: #0f172a;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
        color: #1e3a8a;
      }
      label {
        display: block;
        font-size: 12px;
        margin: 8px 0 4px;
        color: #475569;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 13px;
      }
      button {
        width: 100%;
        padding: 9px;
        margin-top: 12px;
        background: #1e40af;
        color: #fff;
        border: 0;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #e2e8f0;
        color: #0f172a;
      }
      .status {
        font-size: 12px;
        padding: 8px;
        border-radius: 6px;
        margin-bottom: 8px;
      }
      .status.ok {
        background: #dcfce7;
        color: #166534;
      }
      .status.err {
        background: #fee2e2;
        color: #991b1b;
      }
      .muted {
        font-size: 11px;
        color: #64748b;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Monitor de Atividade</h1>
    <div id="content"></div>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
